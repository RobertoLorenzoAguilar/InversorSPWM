<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Anatomia de un pulso PWM: periodo de portadora, tiempo en alto y tiempo en bajo</title>
<rect x="0" y="0" width="600" height="220" fill="#ffffff"/>
<rect x="0" y="0" width="600" height="220" fill="none" stroke="#e5e7eb" stroke-width="2"/>

<path d="M60,160 L60,160 L220,160 L220,40 L420,40 L420,160 L560,160"
      fill="none" stroke="#ea580c" stroke-width="3"/>
<rect x="220" y="40" width="200" height="120" fill="#ea580c" opacity="0.12"/>

<line x1="60" y1="190" x2="560" y2="190" stroke="#9ca3af" stroke-width="1"/>
<line x1="60" y1="182" x2="60" y2="198" stroke="#9ca3af" stroke-width="1"/>
<line x1="560" y1="182" x2="560" y2="198" stroke="#9ca3af" stroke-width="1"/>
<text x="310.0" y="210" text-anchor="middle" font-size="13" fill="#374151">periodo de portadora T = 1 / f_conmutaci&#243;n</text>

<line x1="220" y1="26" x2="420" y2="26" stroke="#9ca3af" stroke-width="1"/>
<line x1="220" y1="20" x2="220" y2="32" stroke="#9ca3af" stroke-width="1"/>
<line x1="420" y1="20" x2="420" y2="32" stroke="#9ca3af" stroke-width="1"/>
<text x="320.0" y="16" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">t_ON (ancho de pulso)</text>

<text x="54" y="165" text-anchor="end" font-size="12" fill="#374151">0V</text>
<text x="54" y="45" text-anchor="end" font-size="12" fill="#374151">Vdc</text>

<text x="218" y="206" text-anchor="end" font-size="11" fill="#6b7280">sube cuando la senoidal supera a la portadora</text>
<text x="422" y="206" font-size="11" fill="#6b7280">baja cuando la portadora vuelve a superar a la senoidal</text>

<text x="20" y="20" font-size="13" font-weight="600" fill="#1f2937">duty = t_ON / T</text>
</svg>